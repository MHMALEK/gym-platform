<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#0a0d0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Gym Coach Platform</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("gym-coach-theme");
          document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
          var lang = localStorage.getItem("gym-coach-lang");
          var fa = lang === "fa";
          document.documentElement.lang = fa ? "fa" : "en";
          document.documentElement.dir = fa ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
